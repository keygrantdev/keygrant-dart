name: keygrant
description: "KeyGrant licensing for Flutter apps: offline-verified leases, trials, licence files, metered uses and key pickup, on iOS, Android, Windows, macOS and Linux."
version: 0.1.1
homepage: https://keygrant.dev
repository: https://github.com/keygrantdev/keygrant-dart/tree/main/sdk-dart
issue_tracker: https://github.com/keygrantdev/keygrant-dart/issues
topics:
  - licensing
  - license-key
  - trial

environment:
  sdk: ^3.6.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.3
  ffi: ^2.1.0
  http: ^1.5.0
  meta: ^1.11.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.keygrant.keygrant
        pluginClass: KeygrantPlugin
        dartPluginClass: KeyGrantPlugin
        dartFileName: src/platform/plugin.dart
      ios:
        pluginClass: KeygrantPlugin
        dartPluginClass: KeyGrantPlugin
        dartFileName: src/platform/plugin.dart
      macos:
        pluginClass: KeygrantPlugin
        dartPluginClass: KeyGrantPlugin
        dartFileName: src/platform/plugin.dart
      windows:
        dartPluginClass: KeyGrantPlugin
        dartFileName: src/platform/plugin.dart
      linux:
        dartPluginClass: KeyGrantPlugin
        dartFileName: src/platform/plugin.dart
